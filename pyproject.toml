[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bored-william"
version = "0.1.0"
description = "Batch capture of roadside billboards from Google Street View, across their full capture history."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Joel Kohn" }]
keywords = ["street-view", "billboards", "outdoor-advertising", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = []

[project.scripts]
bored-william = "bored_william.cli:main"

[tool.setuptools]
packages = ["bored_william"]
